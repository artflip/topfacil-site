<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if page.image and page.image != '' %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  {% if jekyll.environment != 'production' or page.published == false %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/lib/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/experience.css' | relative_url }}?v=4.2">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
<script src="{{ '/assets/lib/bootstrap.min.js' | relative_url }}" defer></script><script src="{{ '/assets/lib/lucide.min.js' | relative_url }}" defer></script><script src="{{ '/assets/navigation.js' | relative_url }}?v=4.2" defer></script></head>
<body class="blog-body">{% include site-header.html %}<main id="conteudo">{{ content }}</main>{% include site-footer.html %}</body></html>
